<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chewy Life 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
  html, body { margin: 0; background: #fff6e8; overflow: hidden; }
  #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fff6e8, #ffd8e6); font-family: Fredoka, sans-serif; color: #4a2c2a; transition: opacity .6s ease; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .t { font-size: 54px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 4px 0 #ffb0c8; }
  #boot .s { margin-top: 10px; font-size: 18px; opacity: .75; text-align: center; }
  #boot .paws { margin-top: 18px; display: flex; gap: 14px; justify-content: center; }
  #boot .paws i { width: 16px; height: 16px; border-radius: 50%; background: #ff8fb0; animation: bp 1s ease-in-out infinite; }
  #boot .paws i:nth-child(2) { animation-delay: .15s; background: #ffcf4a; } #boot .paws i:nth-child(3) { animation-delay: .3s; background: #8fe0c0; }
  @keyframes bp { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.2); } }
</style>
</head>
<body>
<div id="boot"><div><div class="t">Chewy Life</div><div class="s">Waking up Blossom Hollow…</div><div class="paws"><i></i><i></i><i></i></div></div></div>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
