<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pawhaven</title>
<meta name="theme-color" content="#ff8fb0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pawhaven">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
<style>
  html, body { margin: 0; background: #fff6e8; overflow: hidden; }
  /* no browser gestures from the first frame (ROADMAP CT-6, docs/CONTROLS.md §12.9): no pinch or double-tap zoom (pan-x pan-y:
     lists still scroll), no pull-to-refresh, no text selection, no long-press callout ("Save image") */
  html, body { touch-action: pan-x pan-y; overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  img, canvas { -webkit-user-drag: none; -webkit-touch-callout: none; }
  input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
  #boot { touch-action: none; }
  #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #fff6e8, #ffd8e6); font-family: Fredoka, sans-serif; color: #4a2c2a; transition: opacity .6s ease; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .t { font-size: 54px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 4px 0 #ffb0c8; }
  #boot .s { margin-top: 10px; font-size: 18px; opacity: .75; text-align: center; }
  #boot .paws { margin-top: 18px; display: flex; gap: 14px; justify-content: center; }
  #boot .paws i { width: 16px; height: 16px; border-radius: 50%; background: #ff8fb0; animation: bp 1s ease-in-out infinite; }
  #boot .paws i:nth-child(2) { animation-delay: .15s; background: #ffcf4a; } #boot .paws i:nth-child(3) { animation-delay: .3s; background: #8fe0c0; }
  @keyframes bp { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.2); } }
</style>
<script>
  // Safari ignores user-scalable=no (since iOS 10): cancel its gesture events and any multi-finger touchmove from the first
  // frame, before the game has loaded. html.pinch-ok lets a pinch through while the "zoomed in?" card asks for one
  // (ui/mobile.js), so the player can zoom the page back out.
  (function () {
    var D = document, ok = function () { return D.documentElement.classList.contains('pinch-ok'); };
    var stop = function (e) { if (e.cancelable && !ok()) e.preventDefault(); };
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { D.addEventListener(n, stop, { passive: false }); });
    D.addEventListener('touchmove', function (e) { if ((e.touches && e.touches.length > 1) || (e.scale !== undefined && e.scale !== 1)) stop(e); }, { passive: false });
    D.addEventListener('dblclick', stop, { passive: false });
    // CT-7: one finger never pans the page either (nor itch's page around the frame, which a touchmove left uncancelled in
    // our frame would scroll), unless it started in something that scrolls: a menu's list, a tab row, a slider, a text
    // field. The canvas, the HUD and the stick's side are touch-action: none as well (ui/touch.css).
    var free = {}, scrolls = function (e) {
      for (; e && e.nodeType === 1 && e !== D.documentElement; e = e.parentElement) {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.tagName) || e.isContentEditable) return true;
        var s = getComputedStyle(e);
        if ((/auto|scroll/.test(s.overflowY) && e.scrollHeight > e.clientHeight + 1) || (/auto|scroll/.test(s.overflowX) && e.scrollWidth > e.clientWidth + 1)) return true;
      }
      return false;
    };
    D.addEventListener('touchstart', function (e) { for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; free[t.identifier] = scrolls(t.target); } }, { capture: true, passive: true });
    D.addEventListener('touchmove', function (e) { for (var i = 0; i < e.changedTouches.length; i++) if (!free[e.changedTouches[i].identifier]) { stop(e); return; } }, { capture: true, passive: false });
    var done = function (e) { for (var i = 0; i < e.changedTouches.length; i++) delete free[e.changedTouches[i].identifier]; };
    D.addEventListener('touchend', done, { capture: true, passive: true }); D.addEventListener('touchcancel', done, { capture: true, passive: true });
  })();
</script>
</head>
<body>
<div id="boot"><div><div class="t">Pawhaven</div><div class="s">Waking up Blossom Hollow…</div><div class="paws"><i></i><i></i><i></i></div></div></div>
<div id="ui"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
